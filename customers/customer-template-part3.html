<!-- DIGITAL MENU / CUSTOMERS CONTENT -->
<section class="menu-section" id="menu">
  <div class="container">
    <div class="menu-header">
      <p class="section-label">[Section Title]</p>
      <h2 class="section-title">[Section Title]</h2>
      <p>[Section description]</p>
    </div>

    <div class="menu-filters">
      <button class="menu-filter-btn active" data-category="all">All</button>
      <button class="menu-filter-btn" data-category="starters">Starters</button>
      <button class="menu-filter-btn" data-category="main">Main Course</button>
      <button class="menu-filter-btn" data-category="desserts">Desserts</button>
      <button class="menu-filter-btn" data-category="beverages">Beverages</button>
    </div>

    <div class="menu-grid">
      <div class="menu-card">
        <div class="menu-card-img"><img src="../assets/images/bottles/bottle-01.png" alt="[Menu Item Name]"></div>
        <div class="menu-card-body">
          <h4>[Menu Item Name]</h4>
          <div class="menu-price">$[Price]</div>
          <p class="menu-desc">[Short description]</p>
          <span class="menu-veg">Veg</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- GOOGLE REVIEWS -->
<section class="reviews">
  <div class="container">
    <div class="review-card">
      <div class="stars">★★★★★</div>
      <p class="review-text">"[Customer review text]" - [Customer Name]</p>
      <cite>Verified Customer</cite>
    </div>
  </div>
</section>
